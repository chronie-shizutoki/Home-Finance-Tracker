syntax = "proto3";

// Payloads carried inside the v2 frames defined in
//   app/src/main/cpp/protocol/sync_protocol.h
//   app/src/main/java/com/chronie/homemoney/data/sync/protocol/SyncWireProtocol.kt
//
// The framing layer owns the header (magic, opcode, seq, checksums); this file owns only
// what sits in the payload. The split is deliberate: the native transport can route,
// checksum and resume a frame without understanding its contents, and only the layer that
// actually needs the business data has to parse protobuf.
//
// Backward compatibility: sync.proto (v1) is left completely untouched and stays on the
// wire until the legacy adapter is removed. Nothing here reuses a v1 message name, so a
// peer built before this change is unaffected.
//
// Field numbers are frozen. Never renumber or reuse a tag; only append.

package com.chronie.homemoney.data.sync.generated;

option java_package = "com.chronie.homemoney.data.sync.generated";
option java_multiple_files = true;

// ---------------------------------------------------------------------- shared

// Mutation kind for an entity. v1 sent this as a free-form string and only ever wrote
// "CREATE", which is precisely why deletions never propagated. An enum makes the missing
// case impossible to forget.
enum SyncOperation {
  SYNC_OPERATION_UNSPECIFIED = 0;
  // Insert or update. Covers what v1 called both CREATE and UPDATE.
  SYNC_OPERATION_UPSERT = 1;
  // Soft delete. The record still travels so the peer can store a tombstone.
  SYNC_OPERATION_DELETE = 2;
}

// Optional features a peer supports. Used as a bitmask in the `capabilities` fields so
// that new abilities can be advertised without a protocol version bump.
enum SyncCapability {
  SYNC_CAPABILITY_NONE = 0;
  // Can resume an interrupted transfer from a chunk checkpoint.
  SYNC_CAPABILITY_RESUME = 1;
  // Accepts compressed payloads (COMPRESSED frame flag).
  SYNC_CAPABILITY_COMPRESSION = 2;
  // Supports incremental sync from a watermark instead of a full snapshot.
  SYNC_CAPABILITY_DELTA = 4;
  // Supports the HMAC pairing exchange.
  SYNC_CAPABILITY_PAIRING = 8;
}

// Mirrors homemoney::sync::SyncErrorCode and the Kotlin SyncErrorCode enum. Kept as an
// enum here so the wire value is self-describing in a packet capture.
enum SyncError {
  SYNC_ERROR_OK = 0;
  SYNC_ERROR_PROTOCOL_MISMATCH = 1;
  SYNC_ERROR_AUTH_REJECTED = 2;
  SYNC_ERROR_AUTH_TIMEOUT = 3;
  SYNC_ERROR_NETWORK_UNREACHABLE = 4;
  SYNC_ERROR_CONNECT_TIMEOUT = 5;
  SYNC_ERROR_IO_TIMEOUT = 6;
  SYNC_ERROR_PEER_CLOSED = 7;
  SYNC_ERROR_CRC_MISMATCH = 8;
  SYNC_ERROR_PAYLOAD_TOO_LARGE = 9;
  SYNC_ERROR_PARSE_ERROR = 10;
  SYNC_ERROR_APPLY_ERROR = 11;
  SYNC_ERROR_BUSY = 12;
  SYNC_ERROR_CANCELLED = 13;
  SYNC_ERROR_INTERNAL = 14;
  SYNC_ERROR_BAD_MAGIC = 15;
  SYNC_ERROR_UNKNOWN_OPCODE = 16;
}

// --------------------------------------------------------------- handshake

// HELLO payload (opcode 0x01).
message HelloPayload {
  uint32 protocol_version = 1;
  // Oldest version the sender can still fall back to.
  uint32 min_supported_version = 2;
  string device_id = 3;
  string device_name = 4;
  // "ANDROID" | "IOS" | "WEB" | "DESKTOP".
  string device_type = 5;
  string app_version = 6;
  // Bitmask of SyncCapability values.
  uint32 capabilities = 7;
  // Session the initiator wants to resume; 0 asks for a fresh session.
  fixed64 resume_session_id = 8;
  // Correlates every log line of one sync across both devices and both languages.
  string trace_id = 9;
}

// HELLO_ACK payload (opcode 0x02).
message HelloAckPayload {
  // Version both sides will actually speak, always <= the initiator's proposal.
  uint32 negotiated_version = 1;
  string device_id = 2;
  string device_name = 3;
  uint32 capabilities = 4;
  // Echo of the session id the initiator chose, confirming which session was opened.
  //
  // The id is generated by the *initiator*, not the responder, which is the opposite of
  // the usual convention and is forced by the framing layer: native rebuilds every reply
  // header from the request header, so a responder-assigned id could not be carried on the
  // HELLO_ACK header and the two ends would key the session differently for one frame. A
  // random non-zero 64-bit value has no meaningful collision risk across the handful of
  // sessions a phone ever runs at once.
  fixed64 session_id = 5;
  // True when the responder still needs its user to accept the sync. The initiator must
  // wait for AUTH_ACK instead of assuming success.
  bool requires_user_confirmation = 6;
  // Set when the responder refuses outright, e.g. version mismatch or already busy.
  SyncError error = 7;
  string error_message = 8;
  // Responder's pairing nonce, delivered here rather than in AUTH_ACK.
  //
  // The initiator's proof is computed over both nonces, so it cannot build AUTH until it
  // knows this value; carrying it in AUTH_ACK would have forced a pointless extra round
  // trip. Empty when the responder does not advertise SYNC_CAPABILITY_PAIRING.
  bytes server_nonce = 9;
}

// AUTH payload (opcode 0x03). Proves knowledge of the shared pairing code without ever
// putting the code itself on the wire.
message AuthPayload {
  string device_id = 1;
  // Random per-attempt nonce from the initiator.
  bytes client_nonce = 2;
  // HMAC-SHA256(pairing_code, direction_tag || len(client_nonce) || client_nonce ||
  //             len(server_nonce) || server_nonce || session_id).
  //
  // The direction tag differs between the two proofs ("HFS1 client proof" vs
  // "HFS1 server proof") so that an attacker cannot reflect the initiator's own proof back
  // at it as the responder's counter-proof. The length prefixes stop a nonce pair such as
  // ("AB", "C") from hashing the same as ("A", "BC").
  //
  // Canonical implementation: SyncPairing.kt.
  bytes proof = 3;
}

// AUTH_ACK payload (opcode 0x04).
message AuthAckPayload {
  bool accepted = 1;
  bytes server_nonce = 2;
  // Counter-proof so the initiator can verify the responder too, which is what stops a
  // rogue device on the same Wi-Fi from impersonating the peer.
  bytes proof = 3;
  SyncError error = 4;
  string error_message = 5;
}

// ------------------------------------------------------------------ manifest

// MANIFEST payload (opcode 0x10). Describes the transfer before a single byte of data is
// sent, so the receiver can decide what it still needs.
message ManifestPayload {
  fixed64 session_id = 1;
  // Sender only includes records modified after this watermark. 0 means full snapshot.
  int64 since_watermark = 2;
  uint32 total_entities = 3;
  uint64 total_bytes = 4;
  uint32 chunk_count = 5;
  // Ordered aggregate of every entity hash. Lets the receiver detect a truncated or
  // reordered transfer that still passed every per-frame checksum.
  bytes content_hash = 6;
  // Chunk size the sender intends to use; may be lowered by the receiver.
  uint32 chunk_size = 7;
}

// MANIFEST_ACK payload (opcode 0x11).
message ManifestAckPayload {
  fixed64 session_id = 1;
  bool accepted = 2;
  // Highest contiguous chunk index the receiver already holds from a previous attempt.
  // -1 means nothing is held and the transfer starts from chunk 0.
  int32 resume_from_chunk = 3;
  // Receiver's preferred chunk size, clamped to the protocol's min/max.
  uint32 chunk_size = 4;
  // How many chunks may be in flight before an ack is required.
  uint32 window_size = 5;
  SyncError error = 6;
  string error_message = 7;
}

// --------------------------------------------------------------------- data

// A single expense record. Replaces v1's JSON-in-a-string, which forced every field
// through Gson and silently lost type information.
message ExpensePayload {
  string id = 1;
  string type = 2;
  string remark = 3;
  double amount = 4;
  // ISO-8601 date, matching the Room column.
  string date = 5;
}

// One entity revision. The merge-relevant metadata sits outside the typed payload so the
// receiver can decide whether it even needs to decode the body.
message SyncEntityV2 {
  string entity_type = 1;
  string entity_id = 2;
  SyncOperation operation = 3;
  // Monotonic revision counter; the strongest merge signal.
  uint32 version = 4;
  // Wall-clock modification time of the record itself, never the time it was sent.
  int64 updated_at = 5;
  // Tombstone timestamp; 0 when the record is live.
  int64 deleted_at = 6;
  // CRC-32C over the canonical encoding of the payload. Used for idempotency: an entity
  // whose (entity_id, updated_at, entity_hash) triple was already applied is skipped.
  fixed32 entity_hash = 7;

  oneof payload {
    ExpensePayload expense = 16;
  }
}

// CHUNK payload (opcode 0x12).
message ChunkPayload {
  fixed64 session_id = 1;
  uint32 chunk_index = 2;
  repeated SyncEntityV2 entities = 3;
}

// CHUNK_ACK payload (opcode 0x13).
message ChunkAckPayload {
  fixed64 session_id = 1;
  // Cumulative: every chunk up to and including this index has been received intact.
  // -1 while nothing has been received yet, so it is signed.
  int32 acked_through_chunk = 2;
  // Chunks that failed their checksum and must be resent. Retransmitting only these is
  // what keeps a lossy link usable instead of restarting the whole transfer.
  repeated uint32 missing_chunks = 3;
  // Receiver-observed throughput, feeds the sender's adaptive chunk sizing.
  uint32 observed_kbps = 4;
  // Set when the chunk could not be buffered at all - the receiver hit its memory cap, or
  // the index fell outside the manifest. Without these the sender would see a stalled
  // checkpoint and keep retransmitting a chunk that can never be accepted.
  SyncError error = 5;
  string error_message = 6;
}

// --------------------------------------------------------------------- pull

// PULL payload (opcode 0x14).
//
// The reverse direction of the transfer. The framing layer only ever lets the responder
// answer, so the initiator has to ask for each chunk of the peer's delta explicitly. That
// turns out to be a feature rather than a workaround: a pull is naturally resumable (ask
// again for the same index), naturally idempotent (the answer is a pure function of the
// watermark and the index) and naturally flow controlled (the initiator paces itself).
message PullPayload {
  fixed64 session_id = 1;
  // Send everything modified after this watermark. 0 requests a full snapshot.
  int64 since_watermark = 2;
  // Which chunk of the responder's delta is wanted; 0 also implies "compute the delta".
  uint32 chunk_index = 3;
  // Chunk size the initiator prefers, clamped by the responder to the protocol min/max.
  uint32 chunk_size = 4;
}

// PULL_ACK payload (opcode 0x15).
//
// Carries the manifest fields on every chunk rather than in a separate exchange. They cost
// a few dozen bytes and remove an entire round trip plus the state that would be needed to
// remember the answer to it - which matters most on exactly the weak links this refactor
// targets.
message PullAckPayload {
  fixed64 session_id = 1;
  uint32 chunk_index = 2;
  uint32 chunk_count = 3;
  uint32 total_entities = 4;
  // Ordered aggregate over the responder's whole delta; lets the initiator verify the set
  // once every chunk has arrived.
  bytes content_hash = 5;
  // Highest updated_at in the responder's delta. The initiator stores it as the watermark
  // for its next pull, but only after the whole set has been applied.
  int64 new_watermark = 6;
  repeated SyncEntityV2 entities = 7;
  SyncError error = 8;
  string error_message = 9;
}

// ------------------------------------------------------------------- commit

// COMMIT payload (opcode 0x20). Safe to replay: the receiver deduplicates by session id.
message CommitPayload {
  fixed64 session_id = 1;
  uint32 expected_entities = 2;
  bytes content_hash = 3;
}

// One record where both sides had diverged.
message ConflictSummary {
  string entity_type = 1;
  string entity_id = 2;
  // "TOMBSTONE_PRIORITY" | "HIGHER_VERSION" | "NEWER_TIMESTAMP" | "DEVICE_ID_TIE_BREAK".
  string reason = 3;
  // True when the local revision won and the remote one was discarded.
  bool kept_local = 4;
  int64 local_updated_at = 5;
  int64 remote_updated_at = 6;
}

// COMMIT_ACK payload (opcode 0x21).
message CommitAckPayload {
  fixed64 session_id = 1;
  bool applied = 2;
  uint32 inserted_count = 3;
  uint32 updated_count = 4;
  uint32 skipped_count = 5;
  repeated ConflictSummary conflicts = 6;
  SyncError error = 7;
  string error_message = 8;
}

// -------------------------------------------------------------- keepalive

// PING payload (opcode 0x30) and PONG payload (opcode 0x31).
message PingPayload {
  // Sender's monotonic clock in milliseconds, echoed back verbatim so RTT can be measured
  // without the two devices needing synchronised clocks.
  int64 echo_nanos = 1;
}

message PongPayload {
  int64 echo_nanos = 1;
  // Receiver's queue depth, an early warning that it cannot keep up.
  uint32 pending_chunks = 2;
}

// ------------------------------------------------------------------- control

// ERROR payload (opcode 0x40).
message ErrorPayload {
  SyncError code = 1;
  string message = 2;
  // Mirrors homemoney::sync::isRetryable so the peer does not have to hard-code the table.
  bool retryable = 3;
  // Frame that triggered the error, when it can be attributed to one.
  uint32 offending_seq = 4;
}

// BYE payload (opcode 0x41).
message ByePayload {
  // "COMPLETED" | "CANCELLED" | "TIMEOUT" | "SHUTDOWN".
  string reason = 1;
  // True when the sender intends to reconnect and resume this session.
  bool will_resume = 2;
}
