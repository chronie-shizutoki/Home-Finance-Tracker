<!DOCTYPE html>
<html lang="en-US">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="ic_app_icon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title></title>
    <style>
      :root {
        --bg-color: #ffffff;
        --text-color: #000000;
        --link-color: #0066cc;
        --border-color: #e0e0e0;
      }

      html, body {
        background-color: var(--bg-color);
        color: var(--text-color);
        transition: background-color 0.3s ease, color 0.3s ease;
      }

      a {
        color: var(--link-color);
      }

      /* Dark mode support */
      @media (prefers-color-scheme: dark) {
        :root {
          --bg-color: #121212;
          --text-color: #ffffff;
          --link-color: #64b5f6;
          --border-color: #333333;
        }

        /* Add dark mode styles to small tags */
        small {
          color: var(--text-color);
        }

        /* Global div and span element dark mode support */
        div {
          color: var(--text-color);
        }

        span {
          color: var(--text-color);
        }
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
    <!--
      Legacy-browser guard. This MUST stay a classic (non-module) script so it
      executes even on engines that cannot parse the ESNext bundle above.
      If the required feature set is missing we remove the module entry and
      render a fully self-contained notice (no Vue, no modern CSS, no fetch),
      so the message still loads on extremely old browsers.
    -->
    <script>
    (function () {
      'use strict';

      // The bundle is emitted with build.target: 'esnext' and the styles rely on
      // native CSS nesting + backdrop-filter. A browser missing any of these can
      // neither parse the JS nor render the layout, so we show the notice.
      function supportsModernJS() {
        // Syntax the Vite(esnext) output actually uses: arrow fns, const/let,
        // classes, template literals PLUS optional chaining (?.) and nullish
        // coalescing (??). A parse error means the engine is too old to read it.
        try {
          /* eslint-disable no-new-func */
          new Function('return (() => { const x = `t`; class A {}; return x === "t"; })()');
          new Function('var o = { a: 1 }; return o?.a ?? 2;');
        } catch (e) {
          return false;
        }
        return true;
      }

      function supportsModernCSS() {
        // Native CSS nesting (selector(&)) and backdrop-filter. Engines without
        // CSS.supports, or without these features, cannot render the app.
        if (typeof window.CSS === 'undefined' || typeof window.CSS.supports !== 'function') {
          return false;
        }
        var nesting = false;
        var backdrop = false;
        try { nesting = window.CSS.supports('selector(&)'); } catch (e) { nesting = false; }
        try {
          backdrop = window.CSS.supports('backdrop-filter', 'blur(1px)') ||
            window.CSS.supports('-webkit-backdrop-filter', 'blur(1px)');
        } catch (e) { backdrop = false; }
        return nesting && backdrop;
      }

      function isSupported() {
        // Vue 3 reactivity needs Proxy at runtime.
        if (typeof Proxy === 'undefined') return false;
        if (!supportsModernJS()) return false;
        if (!supportsModernCSS()) return false;
        return true;
      }

      if (isSupported()) {
        return;
      }

      // Stop the module entry from mounting a broken app.
      var mod = document.querySelector('script[type="module"]');
      if (mod && mod.parentNode) {
        mod.parentNode.removeChild(mod);
      }

      // Minimal inline translations mirroring the app's supported languages.
      var i18n = {
        'en-US': { t: 'Browser Not Supported', m: 'Home Finance Tracker requires a modern browser. Your current browser is outdated and cannot display the app correctly.', u: 'Update your browser' },
        'zh-CN': { t: '浏览器不兼容', m: '本应用需要现代浏览器。您当前的浏览器版本过旧，无法正常显示应用。', u: '升级您的浏览器' },
        'zh-HK': { t: '瀏覽器不相容', m: '此應用程式需要現代瀏覽器。您目前的瀏覽器版本過舊，無法正常顯示應用程式。', u: '更新您的瀏覽器' },
        'zh-MO': { t: '瀏覽器唔相容', m: '呢個應用程式需要現代瀏覽器。你用緊嘅瀏覽器版本太舊，無法正常顯示。', u: '更新你的瀏覽器' },
        'zh-SG': { t: '浏览器不兼容', m: '本应用需要现代浏览器。您当前的浏览器版本过旧，无法正常显示应用。', u: '升级您的浏览器' },
        'zh-TW': { t: '瀏覽器不相容', m: '此應用程式需要現代瀏覽器。您目前的瀏覽器版本過舊，無法正常顯示應用程式。', u: '更新您的瀏覽器' },
        'id-ID': { t: 'Browser Tidak Didukung', m: 'Home Finance Tracker membutuhkan browser modern. Browser Anda saat ini sudah usang dan tidak dapat menampilkan aplikasi dengan benar.', u: 'Perbarui browser Anda' },
        'ja-JP': { t: '対応していないブラウザ', m: 'Home Finance Tracker には最新のブラウザが必要です。お使いのブラウザは古いため、アプリを正しく表示できません。', u: 'ブラウザを更新する' },
        'ko-KR': { t: '지원되지 않는 브라우저', m: 'Home Finance Tracker는 최신 브라우저가 필요합니다. 현재 브라우저가 너무 오래되어 앱을 정상적으로 표시할 수 없습니다.', u: '브라우저 업데이트' },
        'ms-MY': { t: 'Pelayar Tidak Disokong', m: 'Home Finance Tracker memerlukan pelayar moden. Pelayar semasa anda sudah lama dan tidak dapat memaparkan aplikasi dengan betul.', u: 'Kemas Kini Pelayar Anda' },
        'th-TH': { t: 'เบราว์เซอร์ไม่รองรับ', m: 'Home Finance Tracker ต้องการเบราว์เซอร์รุ่นใหม่ เบราว์เซอร์ที่คุณใช้อยู่เก่าเกินไปจึงแสดงแอปไม่ได้อย่างถูกต้อง', u: 'อัปเดตเบราว์เซอร์ของคุณ' },
        'vi-VN': { t: 'Trình duyệt không được hỗ trợ', m: 'Home Finance Tracker yêu cầu trình duyệt hiện đại. Trình duyệt hiện tại của bạn đã quá cũ và không thể hiển thị ứng dụng đúng cách.', u: 'Cập nhật trình duyệt' }
      };

      function pick() {
        var lang = navigator.language || navigator.userLanguage || 'en-US';
        if (i18n[lang]) return i18n[lang];
        if (lang.indexOf('zh-TW') === 0 || lang.indexOf('TW') >= 0) return i18n['zh-TW'];
        if (lang.indexOf('zh-HK') === 0 || lang.indexOf('HK') >= 0) return i18n['zh-HK'];
        if (lang.indexOf('zh-MO') === 0 || lang.indexOf('MO') >= 0) return i18n['zh-MO'];
        if (lang.indexOf('zh-SG') === 0 || lang.indexOf('SG') >= 0) return i18n['zh-SG'];
        if (lang.indexOf('zh') === 0) return i18n['zh-CN'];
        if (lang.indexOf('ja') === 0) return i18n['ja-JP'];
        if (lang.indexOf('ko') === 0) return i18n['ko-KR'];
        if (lang.indexOf('id') === 0) return i18n['id-ID'];
        if (lang.indexOf('ms') === 0) return i18n['ms-MY'];
        if (lang.indexOf('th') === 0) return i18n['th-TH'];
        if (lang.indexOf('vi') === 0) return i18n['vi-VN'];
        return i18n['en-US'];
      }

      var s = pick();
      var overlay = document.createElement('div');
      overlay.setAttribute('role', 'alert');
      overlay.style.cssText = 'position:fixed;top:0;right:0;bottom:0;left:0;z-index:2147483647;' +
        'background:#ffffff;color:#111111;' +
        'font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;';
      overlay.innerHTML =
        '<div style="position:absolute;top:50%;left:50%;width:90%;max-width:480px;' +
        '-webkit-transform:translate(-50%,-50%);transform:translate(-50%,-50%);' +
        'text-align:center;padding:24px;box-sizing:border-box;">' +
        '<div style="font-size:48px;line-height:1;margin-bottom:16px;" aria-hidden="true">&#9888;&#65039;</div>' +
        '<h1 style="font-size:22px;margin:0 0 12px;font-weight:600;">' + s.t + '</h1>' +
        '<p style="font-size:15px;line-height:1.6;margin:0 0 20px;color:#444444;">' + s.m + '</p>' +
        '<a href="https://browsehappy.com/" target="_blank" rel="noopener noreferrer" ' +
        'style="display:inline-block;padding:10px 20px;background:#0066cc;color:#ffffff;' +
        'text-decoration:none;border-radius:6px;font-size:15px;">' + s.u + ' &rarr;</a>' +
        '</div>';
      document.body.appendChild(overlay);

      // Hide any leftover app shell / build-time footer.
      var app = document.getElementById('app');
      if (app) { app.style.display = 'none'; }
      var smallEls = document.getElementsByTagName('small');
      for (var i = 0; i < smallEls.length; i++) {
        if (smallEls[i].parentNode) { smallEls[i].parentNode.style.display = 'none'; }
      }
    })();
    </script>
    <br>  
    <div style="text-align: center; margin-bottom: 20px">
      <small>
      Build Time: __BUILD_TIME__
      </small>
    </div>
  </body>
</html>
