<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>导出本月数据图片</title>
  <style>
    /* Minimal reset so the Vue app fills the viewport */
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { min-height: 100%; }
    body {
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background-color: #f8fafc;
    }
    @media (prefers-color-scheme: dark) {
      body { background-color: #1a202c; }
    }
    #app { min-height: 100vh; }
  </style>
</head>
<body>
  <div id="app"></div>

  <script type="module">
    import { createApp } from 'vue';
    import ExportImageView from './src/views/ExportImageView.vue';
    import i18n from './src/locales/i18n.js';
    import liquidGlassDirective from './src/directives/liquidGlass.js';
    import { library } from '@fortawesome/fontawesome-svg-core';
    import { FontAwesomeIcon } from '@fortawesome/vue-fontawesome';
    import { faDownload, faCheck, faTimes } from '@fortawesome/free-solid-svg-icons';
    import './src/styles/common.css';
    import './src/styles/liquid-glass.css';

    library.add(faDownload, faCheck, faTimes);

    const app = createApp(ExportImageView);
    app.component('FontAwesomeIcon', FontAwesomeIcon);
    app.use(i18n);
    app.directive('liquid-glass', liquidGlassDirective);
    app.mount('#app');
  </script>
</body>
</html>
