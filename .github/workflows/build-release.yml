name: "Build & Release"

on:
  workflow_dispatch:

jobs:
  # ========== Frontend Build ==========
  build-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24.18.1'
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: client

      - name: Build frontend
        run: npm run build
        working-directory: client

      - name: Upload frontend dist artifact
        uses: actions/upload-artifact@v7
        with:
          name: frontend-dist
          path: client/dist/
          retention-days: 1

  # ========== Go Build ==========
  build-go:
    needs: build-frontend
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          # Linux
          - goos: linux
            goarch: amd64
            artifact: linux-amd64
          - goos: linux
            goarch: arm64
            artifact: linux-arm64
          # Windows
          - goos: windows
            goarch: amd64
            artifact: windows-amd64
          - goos: windows
            goarch: arm64
            artifact: windows-arm64
          # macOS
          - goos: darwin
            goarch: amd64
            artifact: darwin-amd64
          - goos: darwin
            goarch: arm64
            artifact: darwin-arm64

    steps:
      - uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26.5'
          check-latest: true

      - name: Download frontend dist
        uses: actions/download-artifact@v8
        with:
          name: frontend-dist
          path: client/dist/

      - name: Go mod tidy
        run: go mod tidy
        working-directory: server-go

      - name: Build ${{ matrix.goos }}-${{ matrix.goarch }}
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          mkdir -p build
          BIN_NAME="server"
          if [ "${{ matrix.goos }}" = "windows" ]; then
            BIN_NAME="server.exe"
          fi
          go build -ldflags="-s -w" -o "build/${BIN_NAME}" ./cmd/server/
        working-directory: server-go

      - name: Package with frontend dist
        run: |
          PKG="home-finance-tracker-${{ matrix.goos }}-${{ matrix.goarch }}"
          PKG_DIR="build/${PKG}"
          mkdir -p "${PKG_DIR}/client/dist"
          # Copy binary to package dir
          BIN_NAME="server"
          if [ "${{ matrix.goos }}" = "windows" ]; then
            BIN_NAME="server.exe"
          fi
          cp "build/${BIN_NAME}" "${PKG_DIR}/"
          # Copy frontend dist to package dir
          cp -r ../client/dist/* "${PKG_DIR}/client/dist/"
        working-directory: server-go

      - name: Create archive
        run: |
          cd server-go/build
          PKG="home-finance-tracker-${{ matrix.goos }}-${{ matrix.goarch }}"
          if [ "${{ matrix.goos }}" = "windows" ]; then
            zip -r "${PKG}.zip" "${PKG}"
            echo "ASSET=${PKG}.zip" >> $GITHUB_ENV
          else
            tar -czf "${PKG}.tar.gz" "${PKG}"
            echo "ASSET=${PKG}.tar.gz" >> $GITHUB_ENV
          fi

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: home-finance-tracker-${{ matrix.artifact }}
          path: server-go/build/${{ env.ASSET }}
          retention-days: 7

  # ========== Android Release Build ==========
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: |
          sdkmanager "platform-tools" "platforms;android-37.0" "build-tools;37.0.0"

      - name: Decode signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 -d > android/app/release.keystore

      - name: Write local.properties with signing secrets
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          {
            echo "RELEASE_STORE_FILE=release.keystore"
            echo "RELEASE_STORE_PASSWORD=$KEYSTORE_PASSWORD"
            echo "RELEASE_KEY_ALIAS=$KEY_ALIAS"
            echo "RELEASE_KEY_PASSWORD=$KEY_PASSWORD"
          } >> android/local.properties

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      - name: Build release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - name: Copy APK and AGP metadata to release output
        run: |
          # Ship the AGP-generated metadata (output-metadata.json) as-is, so the
          # uploaded output-meta.json is the real artifact produced by the build.
          mkdir -p android/build/release-output
          cp android/app/build/outputs/apk/release/app-release.apk android/build/release-output/
          cp android/app/build/outputs/apk/release/output-metadata.json android/build/release-output/output-meta.json

      - name: Upload android release artifact
        uses: actions/upload-artifact@v7
        with:
          name: android-release
          path: android/build/release-output/*
          retention-days: 7

  # ========== Go Test ==========
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26.5'
          check-latest: true

      - name: Run tests
        run: go test ./... -v -cover
        working-directory: server-go

  # ========== Go Lint ==========
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26.5'
          check-latest: true

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest
          working-directory: server-go
          args: --timeout=5m

  # ========== Release (tag + upload all artifacts) ==========
  release:
    needs: [build-go, build-android, test, lint]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Compute next tag (yyyy.mm.x)
        id: tag
        run: |
          YM=$(date +%Y.%m)
          PREFIX="${YM}."
          MAX=0
          for t in $(git tag --list "${PREFIX}*"); do
            n="${t#$PREFIX}"
            if [[ "$n" =~ ^[0-9]+$ ]] && [ "$n" -gt "$MAX" ]; then
              MAX=$n
            fi
          done
          NEXT=$((MAX + 1))
          TAG="${YM}.${NEXT}"
          echo "Computed tag: $TAG"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Create and push tag
        run: |
          git tag "${{ steps.tag.outputs.tag }}"
          git push origin "${{ steps.tag.outputs.tag }}"

      - name: Download Go build artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: home-finance-tracker-*
          path: artifacts/
          merge-multiple: false

      - name: Download Android release artifact
        uses: actions/download-artifact@v8
        with:
          name: android-release
          path: artifacts/android-release

      - name: Generate checksums
        run: |
          find artifacts/ -type f \( -name "*.zip" -o -name "*.tar.gz" -o -name "*.apk" -o -name "*.json" \) -exec sha256sum {} \; > checksums.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: "Release ${{ steps.tag.outputs.tag }}"
          tag_name: ${{ steps.tag.outputs.tag }}
          body: |
            ## Home Finance Tracker Release ${{ steps.tag.outputs.tag }}

            - **Commit**: ${{ github.sha }}
            - **Tag**: ${{ steps.tag.outputs.tag }}

            ### Assets
            - Go server binaries (Linux / Windows / macOS × amd64 / arm64) bundled with the frontend `client/dist/`
            - Android release APK (`arm64-v8a`) + `output-meta.json`
          files: |
            artifacts/home-finance-tracker-*/*
            artifacts/android-release/*
            checksums.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
